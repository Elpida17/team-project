<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Σύνδεση</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>Σύνδεση</h2>
        
        <form id="loginForm">
			<label> ΑΦΜ: <input type="text" id="afm" inputmode="numeric" required> </label>
            <label> Password: <input type="password" id="password" required> </label>
            <button type="submit">Είσοδος</button>
        </form>

        <nav>
            <a href="citizenRegister.html">Εγγραφή Πολίτη</a> <br>
            <a href="storeRegister.html">Εγγραφή Καταστήματος</a>
        </nav>
    </div>
	
	<script> 
	
	$("#loginForm").submit(function(event) { 
		event.preventDefault(); 
		var loginData = { 
			afm: $("#afm").val(), 
			password: $("#password").val() 
		}; $.ajax({ 
			url: "http://localhost:8080/login", 
			method: "POST", 
			contentType: "application/json", 
			data: JSON.stringify(loginData), 
			success: function(response) { 
				alert("Επιτυχής σύνδεση!"); 
				window.location.href = "searchProduct.html"; 
			}, 
			error: function(xhr) { 
				alert("Αποτυχία σύνδεσης: " + xhr.responseText); 
			} 
		}); 
	}); 
	function addStore() { 
		var storeData = { 
			"afm": parseInt(document.getElementById("afm").value), 
			"shopName": document.getElementById("shopName").value, 
			"owner": document.getElementById("owner").value, 
			"password": document.getElementById("password").value 
		};
		var settings = { 
			"url": "http://localhost:8080/storeRegister", 
			"method": "POST", 
			"timeout": 0, "headers": { 
				"Content-Type": "application/json" 
			}, 
			"data": JSON.stringify(storeData) 
		}; 
		
		$.ajax(settings).done(function (response) { 
			alert(response); 
			window.location.href = "login.html"; 
		}).fail(function (jqXHR) { 
			alert("Σφάλμα: " + jqXHR.responseText); 
		}); 
	} 
</script>

</body>
</html>
