<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Αναζήτηση Προϊόντων</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    
	<div class="cart-icon">
	    <i class="fa-solid fa-cart-shopping"></i>
	    <span id="cart-count">0</span>
	</div>
	
    <h2 style="text-align:center;">Αναζήτηση Προϊόντων</h2> 

	<div class="searchTable">
		<table>
		    <tr>
			   <td> Τύπος: </td>
				<td> <input type='text' id='type'> </td>
			</tr>
			<tr>
				<td> Μάρκα: </td>
				<td> <input type='text' id='brand'> </td>
			</tr>
		</table>
		
		<table>
			<tr>
			   <td> Τιμή Από: </td>
			   <td> <input type='number' id='minPrice'> </td>
			</tr>
			<tr>
			   <td> Τιμή Έως: </td>
			   <td> <input type='number' id='maxPrice'> </td>
			</tr>
		</table>
    </div>

        <div>
            <button id="searchButton" onclick="searchProducts()">Αναζήτηση </button>
        </div>
    </div>

    <table border="1" id="resultsTable">
		<thead>
		    <tr>
		        <th>Τύπος</th>
		        <th>Μάρκα</th>
		        <th>Τιμή</th>
		        <th>Περιγραφή</th>
		        <th>Διαθεσιμότητα</th>
		        <th>Αγορά</th>
		    </tr>
		</thead>
		<tbody id="resultsBody">
			</tbody>
    </table>

    <script>
		
		let cartCount = 0;

		function addToCart() {
		    cartCount++;
		    document.getElementById("cart-count").innerText = cartCount;
		} 
		
		function searchProducts() {

		    var minPriceValue = document.getElementById("minPrice").value;
		    var maxPriceValue = document.getElementById("maxPrice").value;

		    var searchCriteria = {
		        type: document.getElementById("type").value || null,
		        brand: document.getElementById("brand").value || null,
		        minPrice: minPriceValue ? parseFloat(minPriceValue) : null,
		        maxPrice: maxPriceValue ? parseFloat(maxPriceValue) : null
		    };

            var settings = {
                "url": "http://localhost:8080/search",
                "method": "POST",
                "timeout": 0,
                "headers": {
                    "Content-Type": "application/json"
                },
                "data": JSON.stringify(searchCriteria)
            };

            $.ajax(settings).done(function (response) {
                var tableBody = $("#resultsTable tbody");
                tableBody.empty(); 

                if (response.length === 0) {
                    tableBody.append("<tr><td colspan='5' style='text-align:center;'>Δεν βρέθηκαν προϊόντα.</td></tr>");
                    return;
                }

                response.forEach(function(product) {
					var row = "<tr>" +
					    "<td>" + product.type + "</td>" +
					    "<td>" + product.brand + "</td>" +
					    "<td>" + product.price + " €</td>" +
					    "<td>" + product.description + "</td>" +
					    "<td>" + product.numberOfProducts + " τεμ.</td>" +
						"<td><button onclick='addProduct(\"" + product.type + "\")'>Προσθήκη</button></td>" +
					    "</tr>";
                    tableBody.append(row);
                });
            }).fail(function (jqXHR) {
                alert("Σφάλμα κατά την αναζήτηση: " + jqXHR.status);
            });
        }
		
		function addProduct(producType) {

		    var citizenAfm = 111222333; // προσωρινά, για τεστ

		    $.ajax({
		        url: "http://localhost:8080/cart/add",
		        method: "POST",
		        contentType: "application/json",
		        data: JSON.stringify({
		            citizenAfm: citizenAfm,
		            productType: productType,
		            quantity: 1
		        })
		    })
		    .done(function () {
		        addToCart(); // αυξάνει το εικονίδιο
		        alert("Το προϊόν προστέθηκε στο καλάθι");
		    })
		    .fail(function (err) {
		        console.error(err);
		        alert("Αποτυχία προσθήκης στο καλάθι");
		    });
		}
    </script>

</body>
</html>
